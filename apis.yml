aid: gleefulai
url: https://raw.githubusercontent.com/api-evangelist/gleefulai/refs/heads/main/apis.yml
name: Gleeful AI
description: 'Gleeful AI publishes Visibility, an AI-visibility and answer-engine-optimization audit API:
  it scores how visible and understandable a website is to AI assistants and agents, audits AI crawler
  access (GPTBot, ClaudeBot and others), generates a production-ready llms.txt and schema.org markup,
  checks brand citation across assistants, and runs competitor gap analysis. The access model is the notable
  part — there are no API keys. Every priced endpoint answers an unauthenticated request with HTTP 402
  and an x402 v2 challenge in a Payment-Required header, settled in USDC on Base at prices from $0.06
  to $0.55 a call, published machine-readably at /api/pricing alongside /api/capabilities and /api/catalog.
  Discovery, pricing and two preview endpoints are free. It is an agent-native API in both directions:
  built to be paid for and called by an agent, and built to measure whether agents can read you.'
