summary: >-
  The Gleeful AI Visibility API is gone. Between the round-1 harvest on 2026-08-03 —
  when every surface below answered live — and this pass on 2026-08-13, gleefulai.com
  was moved to the GoDaddy/Afternic aftermarket and is now a domain listed for sale.
  The API host visibility.gleefulai.com no longer terminates TLS for its own hostname,
  and every /api/* path returns 404 from the parking origin. This is a lifecycle
  record of an API's death, not a deprecation policy: the provider published no
  versioning policy, no deprecation policy, no Sunset/Deprecation header support, no
  SLA and no status page, and it gave no notice before the surface disappeared.
